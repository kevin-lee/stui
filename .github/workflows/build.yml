name: Build

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

env:
  SBT_OPTS: "-Xss64m -Xmx4G"
  JVM_OPTS: "-Xss64m -Xmx4G"

jobs:

  # The format, scalafix, and UCD-generator checks run once, on one runner; the tests run per platform below.
  lint:
    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: sbt

      - uses: sbt/setup-sbt@v1

      # The action's jvm input defaults to temurin:17 and puts it first on the PATH, which silently replaced setup-java's
      # Temurin 21 for the sbt step (2026-08-23). JDK 21 is the project baseline.
      - uses: VirtusLab/scala-cli-setup@v1.17.0
        with:
          jvm: "temurin:21"

      - name: "Check the UCD generator formats and compiles"
        run: |
          scala-cli fmt --check --scalafmt-conf .scalafmt.conf scripts/unicode
          scala-cli compile scripts/unicode

      - name: "Format and scalafix checks - ${{ github.run_number }}"
        run: |
          java -version
          sbt -v clean scalafmtCheckAll scalafmtSbtCheck "scalafixAll --check"

  # One job per platform and OS (2026-08-30). Running every platform in one job exhausted the 16 GB Linux runner during
  # the Native test phase: sbt runs suites in parallel, the Scala Native test adapter starts one native process per parallel
  # worker, and immix sizes each heap from the machine's physical memory (root cause reproduced under Podman). The Native
  # job therefore runs its suites sequentially, one native process per project. An immix cap (GC_MAXIMUM_HEAP_SIZE) is
  # deliberately not set: it segfaulted the widgets test binary intermittently on macOS arm64 with Scala Native 0.5.12.
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        platform:
          - jvm
          - js
          - native
        include:
          - platform: jvm
            tasks: unicodeJVM/test coreJVM/test testkitJVM/test widgetsJVM/test terminalJVM/test appJVM/test examplesJVM/test
          - platform: js
            tasks: unicodeJS/test coreJS/test testkitJS/test widgetsJS/test terminalJS/test appJS/test examplesJS/test examplesJS/fastLinkJS
          # The `set` must precede the test tasks (sbt runs its command line in order).
          - platform: native
            tasks: '"set every Test / parallelExecution := false" unicodeNative/test coreNative/test testkitNative/test widgetsNative/test terminalNative/test appNative/test examplesNative/test examplesNative/nativeLink'

    runs-on: ${{ matrix.os }}

    # A per-platform job takes 3-6 minutes, the GitHub default is 360. A hang (2026-08-22) must not burn the quota.
    timeout-minutes: 20

    # V8 otherwise takes about a quarter of the machine as its heap limit, per Node process.
    env:
      NODE_OPTIONS: --max-old-space-size=1024

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: sbt

      - uses: sbt/setup-sbt@v1

      - uses: actions/setup-node@v7
        if: matrix.platform == 'js'
        with:
          node-version: 24

      - name: "Build and test ${{ matrix.platform }} on ${{ matrix.os }} - ${{ github.run_number }}"
        run: |
          java -version
          if [ "${{ matrix.platform }}" = "js" ]; then node --version; fi
          sbt -v clean ${{ matrix.tasks }}

      # The demo-run gate (M2c issue 23, extended in M3d issue 36): the demo under a PTY in both screen modes, with the probe
      # unanswered, answered by a terminal without the kitty keyboard protocol (no push may appear), and answered by one with it
      # across the four exit paths (q, the Ctrl-C key, the `!` crash, SIGTERM), each asserting one push and one pop in order.
      - name: "PTY smoke (jvm)"
        if: matrix.platform == 'jvm'
        run: |
          sbt examplesJVM/writeRuntimeClasspath
          CP=$(cat modules/examples/jvm/target/runtime-classpath.txt)
          for mode in "" inline; do
            python3 scripts/pty-smoke/smoke.py -- java -cp "$CP" stui.examples.Main $mode
            python3 scripts/pty-smoke/smoke.py --probe legacy -- java -cp "$CP" stui.examples.Main $mode
            for exit in q ctrl-c crash sigterm; do
              python3 scripts/pty-smoke/smoke.py --probe kitty --exit "$exit" -- java -cp "$CP" stui.examples.Main $mode
            done
          done

      - name: "PTY smoke (native)"
        if: matrix.platform == 'native'
        run: |
          for mode in "" inline; do
            python3 scripts/pty-smoke/smoke.py -- modules/examples/native/target/scala-3.3.8/examples $mode
            python3 scripts/pty-smoke/smoke.py --probe legacy -- modules/examples/native/target/scala-3.3.8/examples $mode
            for exit in q ctrl-c crash sigterm; do
              python3 scripts/pty-smoke/smoke.py --probe kitty --exit "$exit" -- modules/examples/native/target/scala-3.3.8/examples $mode
            done
          done

      - name: "PTY smoke (js)"
        if: matrix.platform == 'js'
        run: |
          for mode in "" inline; do
            python3 scripts/pty-smoke/smoke.py -- node modules/examples/js/target/scala-3.3.8/examples-fastopt/main.js $mode
            python3 scripts/pty-smoke/smoke.py --probe legacy -- node modules/examples/js/target/scala-3.3.8/examples-fastopt/main.js $mode
            for exit in q ctrl-c crash sigterm; do
              python3 scripts/pty-smoke/smoke.py --probe kitty --exit "$exit" -- node modules/examples/js/target/scala-3.3.8/examples-fastopt/main.js $mode
            done
          done
